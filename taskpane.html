<style>
  :root{
    --bg:#ffffff; --bg2:#f7f7f5; --tx:#1a1a19; --tx2:#6b6b68;
    --bd:#e8e8e4; --bd2:#d5d5d0;

    --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:var(--font-sans)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
  .cb-row:hover{filter:brightness(0.97)}
  .cat-hdr:hover{filter:brightness(0.96)}
  button{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {useState,createElement:h}=React;

// Reihenfolge der Kategorien wie im Musterbrief
const CATS=["Ausweis","Wohnen","Bank & Post","AHV / IV","Versicherungen","Steuern",

  {id:5, kat:"Wohnen", dok:"Konto Mietkaution per 31. Dezember des letzten Jahres",
   text:"Ein Sperrkonto mit Ihrer Mietkaution (meist 2–3 Monatsmieten). Falls Sie bei einer Wohngenossenschaft wohnen benötigen wir die Anteilscheine der Genossenschaft. Mietkaution und Genossenschaftsanteile sind Vermögen. Wir rechnen sie bei der ZL-Berechnung mit. Den Saldoausweis erhalten Sie von der Bank, bei der Ihre Kaution liegt. Anteilscheine erhalten Sie von Ihrer Wohngenossenschaft."},
  {id:6, kat:"Wohnen", dok:"Heimrechnung",

  // Bank & Post
  {id:8, kat:"Bank & Post", dok:"Zins- und Saldobelege aller Konten per 31. Dezember des letzten Jahres",
   text:"Sie zeigen Ihr Guthaben und Ihre Zinsen am Jahresende an. Ersparnisse und Zinserträge sind Vermögen und gelten als Einnahmen. Sie bekommen die Belege über Ihr E-Banking, der PostFinance-App oder am Schalter bei Ihrer Bank. Für Auslandskonten bitte direkt bei der zuständigen Bank anfragen."},
  {id:9, kat:"Bank & Post", dok:"Detaillierte Kontoauszüge der letzten drei Monate",

  {id:11, kat:"AHV / IV", dok:"AHV-Rentenverfügung",

  {id:13, kat:"AHV / IV", dok:"Hilflosenentschädigung: Verfügung",

  // Versicherungen
  {id:14, kat:"AHV / IV", dok:"Taggeldabrechnung der Arbeitslosenversicherung",
   text:"Das ist eine Abrechnung der Arbeitslosenkasse. Sie zeigt Ihre ausbezahlten Taggelder. ALV-Taggelder sind Einkommen. Sie erhalten die Abrechnung von Ihrer Arbeitslosenkasse. Meistens wird sie monatlich zugestellt."},
  {id:15, kat:"Versicherungen", dok:"Krankenkassenpolice (Grund- und Zusatzversicherung)",
   text:"Das ist das Versicherungsdokument Ihrer Krankenkasse. Es zeigt, was versichert ist und wie viel Sie bezahlen. Achtung: Die Prämienrechnung allein reicht nicht. Wir brauchen die Police. Die Krankenkasse schickt es Ihnen jährlich. Sie können es aber auch bei der Krankenkasse anfordern."},
  {id:16, kat:"Versicherungen", dok:"Unfallversicherung: Rentenverfügung oder Kapitalauszahlung",
   text:"Das ist ein Entscheid der SUVA oder einer anderen Unfallversicherung über eine Rente oder Auszahlung. Unfallrenten gelten als Einkommen. Kapitalauszahlungen sind Vermögen. Sie erhalten die Informationen von der SUVA oder Ihrer privaten Unfallversicherung."},
  {id:17, kat:"Versicherungen", dok:"Lebensversicherung: Police, Rückkaufswert, Auszahlungen",
   text:"Der Versicherungsvertrag sowie Dokumente über den aktuellen Wert und mögliche Auszahlungen. Der Rückkaufswert gilt als Vermögen. Renten und Auszahlungen sind Einnahmen. Sie erhalten die Informationen von Ihrer Lebensversicherungsgesellschaft."},
  {id:18, kat:"Versicherungen", dok:"Pensionskasse: Rentenbescheid, Vorsorgeausweis, Kapitalauszahlung",
   text:"Das sind Dokumente Ihrer Pensionskasse: der Rentenbescheid sagt, wie viel Rente Sie bekommen, der Vorsorgeausweis zeigt Ihr angespartes Guthaben. Kapitalauszahlungen belegen, ob Sie Geld aus der Pensionskasse als Einmalbetrag bezogen haben. BVG-Renten sind Einnahmen. Kapitalien sind Vermögen. Beides ist Grundlage für die ZL-Berechnung. Sie erhalten die Informationen von Ihrer Pensionskasse. Den Vorsorgeausweis erhalten Sie automatisch einmal pro Jahr per Post."},
  {id:19, kat:"Versicherungen", dok:"Freizügigkeitskonto oder Freizügigkeitspolice",
   text:"Ein Konto oder eine Police mit Vorsorgegeldern bei einem Stellenwechsel. Es ist Vermögen und damit Grundlage für die ZL-Berechnung. Melden Sie sich bei der Bank oder Versicherung, bei der das Geld liegt. Fragen Sie nach dem Jahressaldo per 31. Dezember."},

  {id:20, kat:"Steuern", dok:"Letzte vollständige Steuererklärung",
   text:"Ihre Steuererklärung mit Wertschriftenverzeichnis, Guthabenverzeichnis und Schuldenverzeichnis. Sie gibt eine Übersicht über Vermögen, Schulden und Einkommen. Sie finden die Steuererklärung in Ihren Unterlagen. Eine Kopie erhalten Sie auch beim kantonalen Steueramt."},

  {id:21, kat:"Erbschaft & Schenkung", dok:"Belege über erhaltene oder unverteilte Erbschaften",
   text:"Dokumente zu Erbschaften, die Sie erhalten haben oder die noch nicht aufgeteilt wurden. Erbschaften gelten als Vermögen. Sie erhalten die Belege beim zuständigen Notariat, Willensvollstrecker oder aus dem Nachlass."},
  {id:22, kat:"Erbschaft & Schenkung", dok:"Belege über Schenkungen und Erbvorbezüge",
   text:"Belege über Vermögen, das Sie verschenkt oder vorzeitig an Erben weitergegeben haben. Ebenso Schenkungen, die Sie erhalten haben. Verschenktes oder weitergegebenes Vermögen wird trotzdem angerechnet. Den Schenkungsvertrag finden Sie in Ihren Unterlagen. Er ist meist notariell beglaubigt. Angaben dazu finden sich auch in Ihrer Steuererklärung der betreffenden Jahre."},

  // Immobilien
  {id:23, kat:"Immobilien", dok:"Grundbuchauszug",
   text:"Das ist ein offizielles Register über Eigentum an Liegenschaften. Liegenschaften sind Häuser und Grundstücke. Es belegt Grundeigentum, Hypotheken und Nutzungsrechte. Sie bekommen es beim zuständigen Grundbuchamt."},
  {id:24, kat:"Immobilien", dok:"Aktuelle Verkehrswertschätzung",
   text:"Das ist eine Schätzung des marktüblichen Werts einer Liegenschaft. Liegenschaften sind Häuser und Grundstücke. Der Verkehrswert ist massgebend für die Vermögensanrechnung. Sie bekommen es von einer zugelassenen Schätzungsperson, von Ihrer Bank oder von einer Immobilienfachperson."},
  {id:25, kat:"Immobilien", dok:"Bankbelege über Hypotheken",
   text:"Belege Ihrer Bank über bestehende Hypotheken auf der Liegenschaft. Hypotheken sind Schulden und werden vom Vermögen abgezogen. Sie erhalten es von Ihrer Bank."},
  {id:26, kat:"Immobilien", dok:"Steuerliche Neubewertung",
   text:"Der amtliche Steuerwert Ihrer Liegenschaft, wie er in der Steuererklärung ausgewiesen wird. Wir nutzen ihn als Grundlage für die Vermögensberechnung. Sie finden den Wert in Ihrer Steuererklärung oder beim kantonalen Steueramt."},

  // Arbeit
  {id:27, kat:"Arbeit", dok:"Arbeitsvertrag und letzter Lohnausweis",
   text:"Erwerbseinkommen wird als Einnahme angerechnet. Sie erhalten den Vertrag und den Lohnausweis vom Arbeitgeber."},
  {id:28, kat:"Arbeit", dok:"Bestätigung der Erwerbsaufgabe",
   text:"Ein Nachweis, dass Sie Ihre Arbeit aufgegeben haben (z.B. Kündigung oder Abmeldung bei der Ausgleichskasse). Wir müssen wissen, dass kein Erwerbseinkommen mehr fliesst. Sie finden das Kündigungsschreiben in Ihren Unterlagen. Sie können auch Ihren alten Arbeitgeber um eine Bestätigung bitten."},

  // Scheidung / Unterhalt
  {id:29, kat:"Scheidung / Unterhalt", dok:"Scheidungsurteil oder Trennungsvereinbarung",
   text:"Ein rechtliches Dokument, das Scheidung, Unterhaltsregelungen und Sorgerechtsregelungen festhält. Unterhaltszahlungen beeinflussen das anrechenbare Einkommen. Sie finden das Dokument in Ihren persönlichen Unterlagen. Sie können auch beim zuständigen Gericht eine Kopie anfordern."},

  // Sonstiges
  {id:30, kat:"Sonstiges", dok:"Darlehensvertrag und Rückzahlungsbelege",
   text:"Ein schriftlicher Vertrag über geliehenes Geld und Nachweise über Rückzahlungen. Darlehen können als Schulden abgezogen werden. Erhaltene Darlehen sind Vermögen. Sie finden das Dokument in Ihren persönlichen Unterlagen. Wir akzeptieren auch die Gutschriftanzeige der Bank bei Eingang."},
  {id:31, kat:"Sonstiges", dok:"Fahrzeugausweis und Kilometerstand",
   text:"Der Fahrzeugausweis Ihres Autos und der aktuelle Kilometerstand. Fahrzeuge werden als Vermögen angerechnet. Der Fahrzeugausweis liegt meistens im Fahrzeug. Sie können den Kilometerstand direkt im Auto ablesen."},
  {id:32, kat:"Sonstiges", dok:"Ausländische Renten: Rentenbescheid und Auszahlungsbeleg",
   text:"Offizielle Dokumente aus dem Ausland über Ihre dortige Rente. Ausländische Renten sind Einnahmen und müssen vollständig deklariert werden. Sie erhalten die Dokumente von der jeweiligen ausländischen Rentenbehörde. Manchmal ist eine Übersetzung nötig. In diesem Fall informieren wir Sie darüber."},
];

// Einheitliches Farbschema (keine Emojis, keine Kategorienfarben)
const BG="#88cfff", FG="#0f0aa0";

// Tag eines optionalen Inhaltssteuerelements in der Word-Vorlage,
// das den Einfügeort markiert. Fehlt es, wird am Cursor eingefügt.
const ANCHOR_TAG="ZL-Unterlagen";

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function App(){
  const[sel,setSel]=useState(new Set());
  const[closed,setClosed]=useState(new Set(CATS.slice(1)));
  const[mode,setMode]=useState("full");   // "full" = mit Erklärung; "titel" = nur Kategorien + Titel
  const[msg,setMsg]=useState(null);
  const[busy,setBusy]=useState(false);
  const inWord=typeof window.Office!=="undefined" && Office.context && Office.context.host==="Word";

  const toggle=id=>setSel(s=>{const n=new Set(s);n.has(id)?n.delete(id):n.add(id);return n;});
  const toggleCat=k=>setClosed(s=>{const n=new Set(s);n.has(k)?n.delete(k):n.add(k);return n;});
  const selDocs=DOCS.filter(d=>sel.has(d.id));

  // Kategorien-Reihenfolge = CATS-Konstante; pro Kategorie die ausgewählten Docs
  const grouped=CATS.map(k=>({kat:k, docs:selDocs.filter(d=>d.kat===k)})).filter(g=>g.docs.length>0);

  const flash=(type,text)=>{setMsg({type,text});setTimeout(()=>setMsg(null),2800);};

  // ---------- HTML-Baustein für Word (auch von Copy verwendet) ----------
  // Ein einziger HTML-Block pro Einfügung.
  // HANG = Position, an die ein Tabulatorsprung in einer metrischen Word-Vorlage
  // standardmässig springt (Standard-Tabstopp 1.25 cm). Titel nutzen dieselbe
  // Distanz als hängenden Einzug, die Beschreibung als normalen linken Einzug,
  // damit beide bündig unter dem Text (nicht unter dem Kästchen) beginnen.
  const HANG = "1.25cm";
  const buildInsertHtml=()=>{
    const P_TITLE=`font-family:Arial;font-size:11pt;font-weight:bold;margin:2pt 0 0 ${HANG};text-indent:-${HANG}`;
    const P_DESC =`font-family:Arial;font-size:9pt;font-style:italic;margin:2pt 0 8pt ${HANG}`;
    // Vollbreite Linie: eine unsichtbare 1x1-Tabelle mit Breite 100% und nur einer
    // unteren Zellenrahmenlinie. Tabellen werden von Words HTML-Import sehr
    // zuverlässig übernommen – zuverlässiger als ein CSS-Absatzrahmen, der im
    // Kontext des Platzhalter-Feldes nur als schmale Zeichen-Unterstreichung
    // ankam statt als Linie über die volle Breite.
    const LINE = `<table style="width:100%;border-collapse:collapse;border:none;margin:2pt 0 6pt 0"><tr><td style="border:none;border-bottom:0.75pt solid #000000;padding:0;line-height:1pt;font-size:1pt">&nbsp;</td></tr></table>`;
    return grouped.map((g,gi)=>{
      const spaceTop = gi===0 ? 0 : 12;
      const head=`<p style="font-family:Arial;font-size:11pt;font-weight:bold;margin:${spaceTop}pt 0 0 0">${esc(g.kat)}</p>`;
      const line=LINE;
      const body=g.docs.map(d=>{
        // Kästchen, ein Leerzeichen, ein echter Tabulatorsprung, dann der Titel.
        const t=`<p style="${P_TITLE}">☐ \t${esc(d.dok)}</p>`;
        const b=mode==="full" ? `<p style="${P_DESC}">${esc(d.text)}</p>` : "";
        return t+b;
      }).join("");
      return head+line+body;
    }).join("");
  };

  // Für die Vollständigkeits-Prüfung nach dem Einfügen: der Titel des letzten
  // Dokuments in der letzten Kategorie muss im eingefügten Text vorkommen.
  const lastGroup = grouped.length ? grouped[grouped.length-1] : null;
  const lastDocTitle = lastGroup && lastGroup.docs.length
    ? lastGroup.docs[lastGroup.docs.length-1].dok
    : null;

    // ---------- Plain-Text (für Fallback-Copy) ----------
  const buildPlain=()=>{
    const lines=[];
    grouped.forEach((g,gi)=>{
      if(gi>0)lines.push("");
      lines.push(g.kat);
      lines.push("─".repeat(Math.max(20,g.kat.length)));
      g.docs.forEach(d=>{
        lines.push("☐ \t"+d.dok);
        if(mode==="full")lines.push("\t"+d.text);
      });
    });
    return lines.join("\n");
  };

// ---------- Einfügen in Word ----------
  const insertIntoLetter=async()=>{
    if(!grouped.length)return;
    if(!inWord){flash('err','Nur in Word verfügbar. Nutzen Sie hier «Kopieren».');return;}
    setBusy(true);
    try{
      const html=buildInsertHtml();
      await Word.run(async(context)=>{
        const ccs=context.document.contentControls.getByTag(ANCHOR_TAG);
        ccs.load('items');
        await context.sync();

        const cc = ccs.items.length>0 ? ccs.items[0] : null;
        let insertedRange;
        if(cc){
          insertedRange = cc.insertHtml(html, Word.InsertLocation.replace);
        }else{
          const selRange = context.document.getSelection();
          insertedRange = selRange.insertHtml(html, Word.InsertLocation.after);
        }
        await context.sync();

        // Vollständigkeits-Check: Word's HTML-Einfügung kann beim allerersten
        // Aufruf in einer Sitzung unvollständig ausfallen (bekannter Word/
        // Office.js-Effekt). Fehlt der Titel des letzten Dokuments im
        // eingefügten Text, wird automatisch einmal nachgelegt.
        insertedRange.load('text');
        await context.sync();

        const incomplete = lastDocTitle && (!insertedRange.text || !insertedRange.text.includes(lastDocTitle));
        if(incomplete){
          if(cc){
            cc.insertHtml(html, Word.InsertLocation.replace);
          }else{
            insertedRange.delete();
            const selRange2 = context.document.getSelection();
            selRange2.insertHtml(html, Word.InsertLocation.after);
          }
          await context.sync();
        }
      });
      flash('ok', `Eingefügt: ${grouped.length} Kategorie(n), ${selDocs.length} Dokument(e)`);
    }catch(err){
      console.error(err);
      flash('err','Einfügen fehlgeschlagen – bitte «Kopieren» nutzen.');
    }finally{setBusy(false);}
  };

  // ---------- Copy (HTML + Plain) ----------
  const copy=async()=>{
    if(!grouped.length)return;
    const html=buildInsertHtml();
    const plain=buildPlain();
    try{
      await navigator.clipboard.write([new ClipboardItem({
        'text/html':new Blob([html],{type:'text/html'}),
        'text/plain':new Blob([plain],{type:'text/plain'})
      })]);
      flash('ok','In Zwischenablage kopiert');
    }catch(e){
      try{await navigator.clipboard.writeText(plain);flash('ok','Kopiert');}
      catch(e2){flash('err','Kopieren nicht möglich');}
    }
  };

  const btn=(enabled,active)=>({
    display:"inline-flex",alignItems:"center",gap:6,fontSize:13,fontWeight:500,
    padding:"6px 14px",cursor:enabled?"pointer":"default",borderRadius:6,
    border:`0.5px solid ${active?"var(--ok-bd)":enabled?"#378ADD":"var(--bd)"}`,
    background:active?"var(--ok-bg)":enabled?"#E6F1FB":"transparent",
    color:active?"var(--ok-tx)":enabled?"#0C447C":"var(--tx2)",
    opacity:enabled?1:0.45,transition:"all .15s"
  });

  return h('div',{style:{fontSize:14}},
    h('h1',{className:"sr-only"},"Textbausteine ZL-Dokumente"),

    // Header
    h('div',{style:{padding:"12px 14px",borderBottom:"0.5px solid var(--bd)",background:"var(--bg2)"}},
      h('div',{style:{fontSize:15,fontWeight:600,color:"var(--tx)"}},"ZL-Unterlagen einfügen"),
      h('div',{style:{fontSize:12,color:"var(--tx2)",marginTop:2}},
        sel.size>0
          ? `${sel.size} von ${DOCS.length} ausgewählt · ${grouped.length} Kategorie(n)`
          : `${DOCS.length} Dokumente verfügbar`)
    ),

    // Action-Bar
    h('div',{style:{position:"sticky",top:0,zIndex:5,padding:"10px 14px",borderBottom:"0.5px solid var(--bd)",background:"var(--bg)",display:"flex",flexDirection:"column",gap:8}},
      h('button',{onClick:insertIntoLetter,disabled:!grouped.length||busy,style:{...btn(!!grouped.length&&!busy,false),justifyContent:"center",width:"100%",fontSize:14,padding:"9px 14px"}},
        h('i',{className:"ti ti-file-import",style:{fontSize:16}}),
        busy?"Wird eingefügt…":"In Brief einfügen"
      ),
      h('div',{style:{display:"flex",gap:8}},
        h('button',{onClick:copy,disabled:!grouped.length,style:{...btn(!!grouped.length,false),flex:1,justifyContent:"center"}},
          h('i',{className:"ti ti-copy",style:{fontSize:14}}),"Kopieren"),
        h('button',{onClick:()=>setSel(new Set()),disabled:!sel.size,style:{...btn(!!sel.size,false),justifyContent:"center",background:"transparent",border:"0.5px solid var(--bd2)",color:"var(--tx2)"}},
          "Löschen")
      ),
      h('div',{style:{display:"flex",alignItems:"center",gap:8,fontSize:12,color:"var(--tx2)"}},
        h('span',null,"Einfügen als:"),
        h('label',{style:{display:"flex",alignItems:"center",gap:4,cursor:"pointer"}},
          h('input',{type:"radio",name:"mode",checked:mode==="full",onChange:()=>setMode("full")}),"Mit Erklärung"),
        h('label',{style:{display:"flex",alignItems:"center",gap:4,cursor:"pointer"}},
          h('input',{type:"radio",name:"mode",checked:mode==="titel",onChange:()=>setMode("titel")}),"Nur Titel")
      ),
      msg&&h('div',{style:{fontSize:12,padding:"5px 8px",borderRadius:5,
        background:msg.type==='ok'?"var(--ok-bg)":"#fdecea",
        color:msg.type==='ok'?"var(--ok-tx)":"#a3261d"}},
        h('i',{className:`ti ti-${msg.type==='ok'?'check':'alert-triangle'}`,style:{fontSize:13,marginRight:5}}),msg.text)
    ),

    // Kategorien-Liste (einfarbig, ohne Icons)
    h('div',null,
      ...CATS.map(kat=>{
        const docs=DOCS.filter(d=>d.kat===kat);
        const open=!closed.has(kat);
        const cnt=docs.filter(d=>sel.has(d.id)).length;
        return h('div',{key:kat,style:{borderBottom:"0.5px solid var(--bd)"}},
          h('div',{onClick:()=>toggleCat(kat),className:"cat-hdr",style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"9px 12px",cursor:"pointer",borderLeft:`3px solid ${FG}`,background:open?BG:"transparent"}},
            h('div',{style:{display:"flex",alignItems:"center",gap:6}},
              h('span',{style:{fontSize:12.5,fontWeight:600,color:FG}},kat),
              cnt>0&&h('span',{style:{fontSize:10,padding:"1px 6px",background:FG,color:"#fff",borderRadius:99,lineHeight:1.7}},cnt)
            ),
            h('i',{className:`ti ti-chevron-${open?"up":"down"}`,style:{fontSize:13,color:FG}})
          ),
          open&&h('div',null,...docs.map(doc=>
            h('label',{key:doc.id,className:"cb-row",style:{display:"flex",alignItems:"flex-start",gap:9,padding:"7px 12px 7px 15px",cursor:"pointer",borderLeft:`3px solid ${sel.has(doc.id)?FG:"transparent"}`,background:sel.has(doc.id)?BG:"transparent"}},
              h('input',{type:"checkbox",checked:sel.has(doc.id),onChange:()=>toggle(doc.id),style:{marginTop:2,accentColor:FG,flexShrink:0,width:15,height:15}}),
              h('span',{style:{fontSize:12.5,color:"var(--tx)",lineHeight:1.4}},doc.dok)
            )
          ))
        );
      })
    ),
    h('div',{style:{padding:"10px 14px",fontSize:11,color:"var(--tx2)",lineHeight:1.5}},
      inWord
        ? "Cursor im Brief an die gewünschte Stelle setzen, dann «In Brief einfügen»."
        : "Vorschau-Modus (nicht in Word geöffnet). «Kopieren» funktioniert hier bereits.")
  );
}

function boot(){ReactDOM.createRoot(document.getElementById("root")).render(h(App));}
if(typeof window.Office!=="undefined"){Office.onReady(()=>boot());}else{boot();}
</script>
</body>
</html>
